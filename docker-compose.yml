services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: capsule
      POSTGRES_PASSWORD: capsule
      POSTGRES_DB: timecapsule
    ports:
      - "5432:5432"
    volumes:
      - capsule_pgdata:/var/lib/postgresql/data

volumes:
  capsule_pgdata:
